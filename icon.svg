<svg viewBox="264 50 152 155" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Vertex International chevron mark</title>
  <desc>A geometric upward-pointing V chevron mark in deep blue</desc>

  <!-- Mark: layered V chevrons suggesting upward motion / apex -->
  <!-- Back chevron (muted) -->
  <polygon points="340,60 290,155 310,155 340,100 370,155 390,155" fill="#4a7ec7" opacity="0.35"/>
  <!-- Mid chevron -->
  <polygon points="340,80 282,175 305,175 340,122 375,175 398,175" fill="#2a5aab" opacity="0.6"/>
  <!-- Front chevron (main) -->
  <polygon points="340,100 274,195 300,195 340,144 380,195 406,195" fill="#1a3a7a"/>
</svg>
